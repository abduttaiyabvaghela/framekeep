name: Deploy prod to Hostinger

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framekeep-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod' && vars.FRAMEKEEP_SSH_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring, pdo_sqlite, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      - run: node --check public/assets/library.js
      - name: Release the verified commit
        env:
          HOST: ${{ vars.HOSTINGER_HOST }}
          PORT: ${{ vars.HOSTINGER_PORT }}
          SSH_USER: ${{ vars.HOSTINGER_USER }}
          RELEASE_DIR: ${{ vars.HOSTINGER_RELEASE_DIR }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$PORT" =~ ^[0-9]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$RELEASE_DIR" =~ ^/[-/a-zA-Z0-9_.]+$ && "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" "$SSH_USER@$HOST" \
            bash -s -- "$RELEASE_DIR" "$REVISION" <<'REMOTE'
          set -euo pipefail
          release_dir="$1"
          revision="$2"
          git -C "$release_dir/source" fetch origin prod
          if [[ "$(git -C "$release_dir/source" rev-parse FETCH_HEAD)" != "$revision" ]]; then
            echo "A newer production revision has already been pushed."
            exit 0
          fi
          git -C "$release_dir/source" switch prod
          git -C "$release_dir/source" merge --ff-only "$revision"
          bash "$release_dir/source/deployment/hostinger-release.sh" "$release_dir"
          REMOTE
